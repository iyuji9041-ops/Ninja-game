name: C++ Combat Engine CI & Benchmark

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Run C++ Unit Test Suite
        run: |
          make -C cpp test

      - name: Build C++ Native Combat Engine
        run: |
          make -C cpp all

      - name: Run Headless 10,000+ FPS Simulation Benchmark
        run: |
          ./cpp/shadow_combat_cpp --simulate

      - name: Upload C++ Native Engine Binary
        uses: actions/upload-artifact@v4
        with:
          name: shadow-combat-cpp-linux-x86_64
          path: cpp/shadow_combat_cpp
          if-no-files-found: error
